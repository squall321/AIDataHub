# AX Hub — 연결된 외부 데이터 소스 통합 설정.
#
# 부팅 시 services.sync_bootstrap.bootstrap_sync_sources() 가 이 파일을 읽어
# sync_sources 테이블에 idempotent 하게 등록/갱신한다.
#
# - api_key 는 yaml 에 평문으로 두지 마라. 환경변수 이름을 api_key_env 로 명시.
# - mapping_rules 변경 → 해당 source 의 cursor 가 자동 리셋되지 않는다. 필요시
#   reset_cursor_on_mapping_change: true 옵션 추가.
# - name 이 같은 행이 DB 에 있으면 PATCH (mapping_rules / base_url / api_key 등 갱신).
#   DB 에만 있고 yaml 에 없는 source 는 건드리지 않음 (수동 등록 보존).
#
# 환경변수:
#   AIDH_SYNC_CONFIG_FILE=/path/to/sync_sources.yml  (생략 시 config/sync_sources.yml)
#   AIDH_SYNC_BOOTSTRAP=false                          (생략 시 true — 파일 있으면 적용)

sources:
  # ---------------------------------------------------------------------------
  # SignalForge VOC (Galaxy S 시리즈) — 다른 제품 라인은 본 항목 복사 후
  # name 과 list_endpoint 만 변경 (예: signalforge-gz, /api/v1/products/GZ/voc).
  # ---------------------------------------------------------------------------
  - name: signalforge-gs
    description: "SignalForge VOC pull — Galaxy S25"
    # 같은 호스트의 SF backend (HWAX portal routes.env 와 동일 주소).
    # 'signalforge-backend' 같은 컨테이너 호스트명은 이 박스에서 해석 불가.
    base_url: "http://127.0.0.1:18000"
    api_key_env: SF_API_KEY          # 환경변수에서 키 읽음 (yaml 에 평문 X)
    auth_header: "X-API-Key"
    # 주의: GS 는 '시리즈' 코드라 0건 반환 — 제품 코드 (GS25) 를 써야 한다.
    list_endpoint: "/api/v1/products/GS25/voc"
    list_method: GET
    cursor_param: offset             # SF 는 limit/offset 페이지네이션
    since_param: from                # SF 는 published_at 기준 server-side
    limit_param: limit
    page_size: 100
    max_rps: 4.0
    retry_max: 3
    retry_backoff_sec: 2.0
    trust_pii_masked: false
    schedule_cron: "*/30 * * * *"
    enabled: true
    mapping_rules:
      id_field: id
      title_template: "{content_original|truncate:80}"
      body_field: content_original
      summary_template: "{product.code} VOC — {sentiment_label} ({platform.code}, {country_code})"
      tags_fields:
        - categories
        - country_code
        - platform.code
        - sentiment_label
      tags_prefix:
        country_code: "country:"
        platform.code: "channel:"
        sentiment_label: "sentiment:"
        categories: "voc:"
      subject_keywords_fields:
        - product.code
        - product.name_en
      valid_from_field: processed_at
      year_field: processed_at
      data_type: DOC
      team: MX
      group: VOC
      doc_type: voc_report
      agents:
        - market-voc-analyst
      classification: internal
      language: ko
      sentiment_field: sentiment_label
      transform:
        sentiment_to_severity:
          very_negative: critical
          negative: major
          neutral: info
          positive: info
        severity_to_quality_score:
          critical: 100
          major: 75
          minor: 50
          info: 25
      filter:
        # SF VOC schema 에 pii_masked 컬럼 없음 (2026-05 확인) → processed_at 만 강제.
        # PII 보호는 trust_pii_masked=false 로 classification='confidential' 강제로 달성.
        require_processed_at: true

  # ---------------------------------------------------------------------------
  # MX White Paper — Sprint 3 offset 페이지네이션 사용.
  # ---------------------------------------------------------------------------
  - name: mxwp
    description: "MX White Paper 위키 (DocumentJSON v1.0) — published 미러"
    # 같은 호스트의 MXWP api (HWAX portal routes.env 와 동일 주소).
    base_url: "http://127.0.0.1:8800"
    api_key_env: MXWP_INTERNAL_KEY
    auth_header: "X-API-Key"
    list_endpoint: "/api/v1/documents"
    list_method: GET
    detail_endpoint: "/api/v1/documents/{slug}"
    cursor_param: offset
    since_param: "_unsupported_updated_since"   # 서버 미지원 — sync_svc 가 자동 skip
    limit_param: limit
    page_size: 100
    max_rps: 2.0
    retry_max: 3
    retry_backoff_sec: 2.0
    trust_pii_masked: false
    schedule_cron: "*/30 * * * *"
    enabled: true
    mapping_rules:
      # MXWP 응답은 list 도 detail 도 모두 'id' 키 (UUID) — 'document_id' 키 없음.
      id_field: id
      title_field: title
      summary_field: summary
      # tags 는 detail 의 content.metadata.tags 에 — sync_svc 가 detail fetch
      # 후 content.metadata 를 doc.metadata 로 평탄화하므로 'metadata.tags' 접근.
      tags_fields:
        - metadata.tags
        - metadata.owners
        - status
      tags_prefix:
        metadata.owners: "author:"
        status: "status:"
      subject_keywords_fields:
        - metadata.tags
        - metadata.keywords
      valid_from_field: created_at
      year_field: created_at
      data_type: DOC
      team: MX
      group: WP
      doc_type: whitepaper
      agents:
        - mx-whitepaper-analyst
      # confidentiality 는 매핑 룰만으론 표현 어려움 — sync_svc 자체 변환 추가
      # 필요. 기본 internal 유지.
      classification: internal
      language: ko
      list_filter:
        status: published
      sections_field: sections
      attachments_field: "content.attachments"
      attachment_mode: url_ref
      attachment_url_template: "{base_url}/api/v1/files/{image_id}"

  # ---------------------------------------------------------------------------
  # MaterialTwin — 재료 물성 카탈로그(heax 앱). heax Caddy 경유(포트 무관 안정 URL).
  #   Caddy 가 /apps/<id>/ 프리픽스를 strip 하므로 list_endpoint 에 /api 를 포함한다.
  #   무인증(company visibility) — api_key 불필요.
  #
  # 2026-08-08 — /api/materials → /api/export/materials 로 바꿨다. 이유 둘.
  #   (1) /api/materials 는 목록이라 attributes 가 {"source":"mcp"} 한 줄뿐이었다.
  #       그래서 허브에 재료 이름만 523건 쌓이고 물성값은 0건이었다(실측).
  #       /api/export/materials 는 재료마다 물성값·측정조건·tier·출처를 다 실어 보낸다.
  #   (2) _fetch_page 는 응답에서 next_cursor 를 찾고 없으면 한 페이지에서 종료한다.
  #       구 엔드포인트는 {items,total,page,size} 만 줘서 매 실행 100건에서 멈춰 있었다
  #       (sync_runs.fetched_count 가 계속 100). 새 엔드포인트가 next_cursor 를 낸다.
  #   page_size 를 50 으로 낮춘 것은 문서 하나가 물성 수백 건을 안고 오기 때문이다
  #   (EMC 는 512 건). 100 이면 한 응답이 과하게 커진다.
  # ---------------------------------------------------------------------------
  - name: materialtwin
    description: "MaterialTwin 재료 물성 카탈로그 — 물성값·조건·출처 포함 미러"
    base_url: "http://127.0.0.1:4180"
    list_endpoint: "/apps/materialtwin_web/api/export/materials"
    list_method: GET
    cursor_param: page             # materialtwin 은 page/size 페이지네이션(offset 아님)
    limit_param: size
    page_size: 50
    max_rps: 2.0
    retry_max: 3
    retry_backoff_sec: 2.0
    trust_pii_masked: true         # 사내 재료 데이터(PII 아님)
    schedule_cron: "0 */6 * * *"   # 재료 카탈로그는 자주 안 바뀜 — 6시간마다
    enabled: true
    mapping_rules:
      id_field: id
      title_field: name
      summary_template: "{category} — {name} (물성 {n_properties}건 · 출처 {n_sources}건)"
      # body 는 앱이 렌더한 물성 목록 텍스트다 — 물성명·값·단위·조건·tier·출처가 한 줄씩
      # 펴져 있어 전문검색이 걸린다. description 은 카탈로그 재료에서 전부 null 이라
      # 본문이 빈 문서가 적재되고 있었다.
      body_field: body
      tags_fields:
        - category
        - material_code
      tags_prefix:
        category: "category:"
        material_code: "code:"
      subject_keywords_fields:
        - name
        - material_code
      content_extra_fields:        # 구조 보존 — 값·단위·조건·tier·출처 원형 그대로
        - properties
        - sources
      valid_from_field: created_at
      year_field: created_at
      data_type: DOC
      team: MX
      group: MAT
      doc_type: material_card
      agents:
        - material-twin-analyst
      classification: internal
      language: ko

# ---------------------------------------------------------------------------
# 추가 옵션 (모두 선택):
#
# defaults:
#   max_rps: 2.0              # sources 가 명시 안 했을 때 기본
#   retry_max: 3
#   trust_pii_masked: false
#
# preserve_unknown: true      # yaml 에 없는 DB source 도 enabled=true 유지 (기본)
# reset_cursor_on_mapping_change: false  # mapping 룰 변경 시 cursor 자동 리셋
# ---------------------------------------------------------------------------
